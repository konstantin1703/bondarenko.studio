name: Stage 11A Full-Page Calibration validation

on:
  push:
    branches:
      - stage11a-full-page-calibration
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: stage11a-full-page-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-stage11a:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      HEAD_SHA: ${{ github.sha }}
      HEAD_REF: stage11a-full-page-calibration
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org

    steps:
      - name: Checkout Stage 11A HEAD
        uses: actions/checkout@v4
        with:
          ref: stage11a-full-page-calibration
          fetch-depth: 0

      - name: Confirm checked-out HEAD
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run complete Stage 11A validation
        shell: bash
        run: |
          set +e
          mkdir -p stage11a-validation/logs
          : > stage11a-validation/results.tsv
          failures=0

          run_check() {
            name="$1"
            shift
            echo "[stage11a] ${name}: $*"
            "$@" >"stage11a-validation/logs/${name}.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> stage11a-validation/results.tsv
            cat "stage11a-validation/logs/${name}.log"
            if [ "$code" -ne 0 ]; then failures=1; fi
          }

          run_check tokens-build npm run tokens:build
          run_check source-check npm run source:check
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check unit-tests npm run test
          run_check build npm run build
          run_check e2e npm run test:e2e
          run_check visual npm run test:visual
          run_check contact-sheets node scripts/create-stage11a-contact-sheets.mjs
          run_check hero-reference-overlay npm run visual:overlay -- \
            tests/visual/references/hero.png \
            tests/visual/actual/stage11a-hero-1630x965.png \
            stage11a-hero-runtime
          run_check central-panels-reference-overlay npm run visual:overlay -- \
            tests/visual/references/central-panels.png \
            tests/visual/actual/stage11a-central-panels-1536x1024.png \
            stage11a-central-panels-runtime
          run_check configurator-reference-overlay npm run visual:overlay -- \
            tests/visual/references/configurator.png \
            tests/visual/actual/stage11a-configurator-1672x941.png \
            stage11a-configurator-runtime
          run_check projects-before-after npm run visual:overlay -- \
            tests/visual/actual/stage9-projects-1536x700.png \
            tests/visual/actual/stage11a-projects-1536.png \
            stage11a-projects-before-after
          run_check workflow-before-after npm run visual:overlay -- \
            tests/visual/actual/stage9-workflow-1536x700.png \
            tests/visual/actual/stage11a-workflow-1536.png \
            stage11a-workflow-before-after
          run_check technologies-before-after npm run visual:overlay -- \
            tests/visual/actual/stage9-technologies-1536x700.png \
            tests/visual/actual/stage11a-technologies-1536.png \
            stage11a-technologies-before-after
          run_check full-page-desktop-before-after npm run visual:overlay -- \
            tests/visual/actual/stage9-full-page-1440.png \
            tests/visual/actual/stage11a-full-page-1440.png \
            stage11a-full-page-desktop-before-after
          run_check full-page-mobile-before-after npm run visual:overlay -- \
            tests/visual/actual/stage9-full-page-390.png \
            tests/visual/actual/stage11a-full-page-390.png \
            stage11a-full-page-mobile-before-after
          run_check overflow-desktop bash -c '! grep -q '"'"'"horizontalOverflow": true'"'"' stage11a-validation/measurements.json'
          run_check overflow-mobile node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
            await browser.close();
            if (overflow) process.exit(1);
          })();
          NODE
          run_check evidence-files bash -c '
            test -s tests/visual/actual/stage11a-hero-1630x965.png \
              -a -s tests/visual/actual/stage11a-hero-mobile-390x844.png \
              -a -s tests/visual/actual/stage11a-central-panels-1536x1024.png \
              -a -s tests/visual/actual/stage11a-central-panels-mobile-390x1800.png \
              -a -s tests/visual/actual/stage11a-configurator-1672x941.png \
              -a -n "$(find tests/visual/actual -maxdepth 1 -name '"'"'stage11a-configurator-mobile-390x*.png'"'"' -print -quit)" \
              -a -s tests/visual/actual/stage11a-projects-1536.png \
              -a -s tests/visual/actual/stage11a-workflow-1536.png \
              -a -s tests/visual/actual/stage11a-technologies-1536.png \
              -a -s tests/visual/actual/stage11a-contact-footer-1536.png \
              -a -s tests/visual/actual/stage11a-full-page-1440.png \
              -a -s tests/visual/actual/stage11a-full-page-390.png \
              -a -s tests/visual/contact-sheets/stage11a-full-page-desktop-contact-sheet.png \
              -a -s tests/visual/contact-sheets/stage11a-full-page-mobile-contact-sheet.png \
              -a -s tests/visual/overlays/stage11a-hero-runtime-overlay.png \
              -a -s tests/visual/diffs/stage11a-hero-runtime-diff.png \
              -a -s tests/visual/overlays/stage11a-central-panels-runtime-overlay.png \
              -a -s tests/visual/diffs/stage11a-central-panels-runtime-diff.png \
              -a -s tests/visual/overlays/stage11a-configurator-runtime-overlay.png \
              -a -s tests/visual/diffs/stage11a-configurator-runtime-diff.png \
              -a -s stage11a-validation/measurements.json'
          run_check security-env-local bash -c '! find . -path "./node_modules" -prune -o -name ".env.local" -print -quit | grep -q .'
          run_check security-secrets bash -c '! grep -RIE --exclude-dir=node_modules --exclude-dir=.git --exclude="package-lock.json" "(sk-[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|SUPABASE_(SERVICE_ROLE|ANON)_KEY=.\+|WEBHOOK_SECRET=.\+|SMTP_PASSWORD=.\+)" src .env.example'
          run_check security-client-network bash -c '! grep -RIE "fetch[[:space:]]*\(|XMLHttpRequest|WebSocket|axios|localStorage|sessionStorage|URLSearchParams|use server|gtag|GoogleAnalytics|segment|mixpanel|amplitude|posthog" src/components src/data'
          run_check security-external-form bash -c '! grep -RIE "<form[^>]+action=|formAction=|mailto:|https://.*form" src/components/sections/ContactFoundation'

          python3 - <<'PY'
          from pathlib import Path
          import json, os
          rows=[]
          for line in Path('stage11a-validation/results.tsv').read_text().splitlines():
              name, code=line.split('\t')
              rows.append({'check':name,'exit_code':int(code)})
          payload={
              'validated_commit': os.environ['HEAD_SHA'],
              'branch': os.environ['HEAD_REF'],
              'results': rows,
          }
          Path('stage11a-validation/results.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

          exit "$failures"

      - name: Commit Stage 11A runtime evidence
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tests/visual/actual/stage11a-*.png \
            tests/visual/contact-sheets/stage11a-*.png \
            tests/visual/overlays/stage11a-*.png \
            tests/visual/diffs/stage11a-*.png \
            stage11a-validation/measurements.json \
            stage11a-validation/results.json
          if git diff --cached --quiet; then
            echo "Stage 11A evidence is already current."
            exit 0
          fi
          git commit -m "test: update Stage 11A visual evidence [skip ci]"
          git push origin HEAD:stage11a-full-page-calibration

      - name: Upload Stage 11A validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11a-full-page-${{ env.HEAD_SHA }}
          path: |
            stage11a-validation/
            test-results/
            playwright-report/
            tests/visual/actual/stage11a-*.png
            tests/visual/contact-sheets/stage11a-*.png
            tests/visual/overlays/stage11a-*.png
            tests/visual/diffs/stage11a-*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Stage 11A commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Stage 11A full-page calibration passed"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            state=error
            description="Stage 11A full-page calibration cancelled"
          else
            state=failure
            description="Stage 11A full-page calibration failed"
          fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"state": sys.argv[1], "target_url": sys.argv[2], "description": sys.argv[3], "context": "stage11a/full-page-validation"}))' "$state" "$target_url" "$description")"
