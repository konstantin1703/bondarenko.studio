name: Stage 4 final HEAD validation

on:
  push:
    branches:
      - stage4-foundation-recovery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4-final-head-validation
  cancel-in-progress: true

jobs:
  validate-current-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout current branch HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Record validated commit
        run: |
          git rev-parse HEAD | tee .validated-head
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete Stage 4 validation
        shell: bash
        run: |
          set +e
          mkdir -p final-validation/logs
          : > final-validation/results.tsv
          failures=0

          run_check() {
            name="$1"
            shift
            echo "[stage4-final] ${name}: $*"
            "$@" >"final-validation/logs/${name}.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> final-validation/results.tsv
            cat "final-validation/logs/${name}.log"
            if [ "$code" -ne 0 ]; then
              failures=1
            fi
          }

          run_check tokens-build npm run tokens:build
          run_check source-check npm run source:check
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check unit-tests npm run test
          run_check build npm run build
          run_check e2e npm run test:e2e
          run_check visual npm run test:visual

          run_check evidence-files test -s tests/visual/actual/hero-1630x965.png \
            -a -s tests/visual/actual/central-panels-1536x1024.png \
            -a -s tests/visual/actual/configurator-1672x941.png \
            -a -s tests/visual/actual/mobile-390.png \
            -a -s tests/visual/actual/octagonal-core-idle.png \
            -a -s tests/visual/actual/octagonal-core-active.png \
            -a -s tests/visual/overlays/hero-runtime-overlay.png \
            -a -s tests/visual/overlays/central-panels-runtime-overlay.png \
            -a -s tests/visual/overlays/configurator-runtime-overlay.png \
            -a -s tests/visual/diffs/hero-runtime-diff.png \
            -a -s tests/visual/diffs/central-panels-runtime-diff.png \
            -a -s tests/visual/diffs/configurator-runtime-diff.png

          run_check overlay-hero npm run visual:overlay -- tests/visual/references/hero.png tests/visual/actual/hero-1630x965.png hero-runtime
          run_check overlay-central-panels npm run visual:overlay -- tests/visual/references/central-panels.png tests/visual/actual/central-panels-1536x1024.png central-panels-runtime
          run_check overlay-configurator npm run visual:overlay -- tests/visual/references/configurator.png tests/visual/actual/configurator-1672x941.png configurator-runtime

          python3 - <<'PY'
          from pathlib import Path
          import json, os
          rows = []
          for line in Path('final-validation/results.tsv').read_text().splitlines():
              name, code = line.split('\t')
              rows.append({'check': name, 'exit_code': int(code)})
          payload = {
              'commit': os.environ['GITHUB_SHA'],
              'results': rows,
              'runtime_evidence': sorted(str(p) for p in Path('tests/visual/actual').glob('*.png')),
              'overlays': sorted(str(p) for p in Path('tests/visual/overlays').glob('*.png')),
              'diffs': sorted(str(p) for p in Path('tests/visual/diffs').glob('*.png')),
          }
          Path('final-validation/results.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY

          exit "$failures"

      - name: Create local validation bootstrap bundle
        run: |
          tar -czf stage4-current-head-local-bootstrap.tar.gz \
            --exclude=.git \
            --exclude=.next \
            --exclude=test-results \
            --exclude=playwright-report \
            --exclude=stage4-current-head-local-bootstrap.tar.gz \
            .

      - name: Upload validation evidence and local bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: stage4-final-head-${{ github.sha }}
          path: |
            .validated-head
            final-validation/
            stage4-current-head-local-bootstrap.tar.gz
            tests/visual/actual/
            tests/visual/overlays/
            tests/visual/diffs/
          retention-days: 7
          if-no-files-found: error
