name: Hero Lab quality

on:
  push:
    branches:
      - hero-lab-premium
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-lab:
    name: Build and capture desktop Hero
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bnd-hero-lab.log 2>&1 &
          npx -y wait-on@8.0.4 http://127.0.0.1:3000/hero-lab

      - name: Capture 1440 desktop gate
        run: |
          mkdir -p hero-lab-qa
          npx playwright screenshot \
            --browser chromium \
            --viewport-size="1440,1000" \
            --wait-for-timeout=1200 \
            http://127.0.0.1:3000/hero-lab \
            hero-lab-qa/hero-1440x1000.png

      - name: Capture wide desktop reference
        run: |
          npx playwright screenshot \
            --browser chromium \
            --viewport-size="1728,1117" \
            --wait-for-timeout=1200 \
            http://127.0.0.1:3000/hero-lab \
            hero-lab-qa/hero-1728x1117.png

      - name: Upload Hero Lab QA
        uses: actions/upload-artifact@v4
        with:
          name: bnd-hero-lab-qa
          path: hero-lab-qa/*.png
          if-no-files-found: error
