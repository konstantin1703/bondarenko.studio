name: Stage 6 export reference

on:
  push:
    branches:
      - stage6-central-panels-calibration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-central-panels-calibration
          fetch-depth: 0
      - name: Upload Stage 6 working tree and visual reference
        uses: actions/upload-artifact@v4
        with:
          name: stage6-reference-${{ github.sha }}
          path: |
            src/
            tests/
            scripts/
            public/
            docs/
            package.json
            package-lock.json
            playwright.config.ts
            tsconfig.json
            next.config.*
            eslint.config.*
            vitest.config.*
          retention-days: 2
          include-hidden-files: true
          if-no-files-found: warn
      - name: Publish export run marker
        shell: bash
        run: |
          mkdir -p docs
          printf 'run_id=%s\nsource_sha=%s\nartifact=stage6-reference-%s\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ github.sha }}" > docs/.stage6-export-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.stage6-export-run
          git commit -m "chore: record Stage 6 export run [skip ci]"
          git push origin HEAD:stage6-central-panels-calibration
