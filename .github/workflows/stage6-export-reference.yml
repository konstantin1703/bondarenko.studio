name: Stage 6 export reference

on:
  push:
    branches:
      - stage6-central-panels-calibration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-central-panels-calibration
          fetch-depth: 0
      - name: Upload Stage 6 source and visual reference
        uses: actions/upload-artifact@v4
        with:
          name: stage6-reference-${{ github.sha }}
          path: |
            tests/visual/references/central-panels.png
            tests/visual/actual/central-panels-1536x1024.png
            src/components/problem-explorer/
            src/components/product-assembler/
            src/components/layout/SectionFrame/
            src/components/hud/
            src/components/graphics/ConnectorLine/
            src/data/foundation-fixtures.ts
            src/tests/
            package.json
            playwright.config.ts
          retention-days: 2
          if-no-files-found: warn
      - name: Publish export run marker
        shell: bash
        run: |
          mkdir -p docs
          printf 'run_id=%s\nsource_sha=%s\nartifact=stage6-reference-%s\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ github.sha }}" > docs/.stage6-export-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.stage6-export-run
          git commit -m "chore: record Stage 6 export run [skip ci]"
          git push origin HEAD:stage6-central-panels-calibration
