name: Apply Stage 5.1 source bundle

on:
  push:
    branches:
      - stage5-hero-calibration-pass-2
    paths:
      - scripts/stage5-1-source-bundle/chunk-005.txt

permissions:
  contents: write

concurrency:
  group: apply-stage5-1-source
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5-hero-calibration-pass-2
          fetch-depth: 0
      - name: Decode Stage 5.1 source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          parts=sorted(Path('scripts/stage5-1-source-bundle').glob('chunk-*.txt'))
          encoded=''.join(part.read_text(encoding='utf-8') for part in parts)
          payload=json.loads(gzip.decompress(base64.b64decode(encoded)))
          for item in payload['files']:
              target=Path(item['path'])
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(base64.b64decode(item['base64']))
          PY
          rm -rf scripts/stage5-1-source-bundle
          rm -f .github/workflows/apply-stage5-1-source.yml
      - name: Commit calibrated Hero source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Stage 5.1 targeted Hero calibration"
          git push origin HEAD:stage5-hero-calibration-pass-2
