name: Apply Stage 6 calibration bundle

on:
  push:
    branches:
      - stage6-central-panels-calibration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-stage6-calibration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-central-panels-calibration
          fetch-depth: 0

      - name: Reassemble and apply Stage 6 source
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/stage6-calibration-bundle/chunk-*.txt > /tmp/stage6-bundle.b64
          base64 --decode /tmp/stage6-bundle.b64 > /tmp/stage6-bundle.json.gz
          gzip --decompress --stdout /tmp/stage6-bundle.json.gz > /tmp/stage6-bundle.json
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json

          payload = json.loads(Path('/tmp/stage6-bundle.json').read_text(encoding='utf-8'))
          for item in payload['files']:
              target = Path(item['path'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(item['base64']))
          print(f"Applied {len(payload['files'])} Stage 6 files")
          PY

      - name: Remove transfer-only files
        shell: bash
        run: |
          rm -rf scripts/stage6-calibration-bundle
          rm -f .github/workflows/apply-stage6-calibration.yml

      - name: Commit Stage 6 calibration source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: calibrate Stage 6 central panels [skip ci]"
          git push origin HEAD:stage6-central-panels-calibration
