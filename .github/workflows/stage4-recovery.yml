name: Stage 4 recovery and runtime validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-foundation-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate Stage 4
        run: |
          npm run tokens:build
          npm run source:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run test:e2e
          npm run test:visual
      - name: Create overlays and diffs
        run: |
          npm run visual:overlay -- tests/visual/references/hero.png tests/visual/actual/hero-1630x965.png hero-runtime
          npm run visual:overlay -- tests/visual/references/central-panels.png tests/visual/actual/central-panels-1536x1024.png central-panels-runtime
          npm run visual:overlay -- tests/visual/references/configurator.png tests/visual/actual/configurator-1672x941.png configurator-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: stage4-runtime-evidence
          path: |
            package-lock.json
            tests/visual/actual
            tests/visual/overlays
            tests/visual/diffs
