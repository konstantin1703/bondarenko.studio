name: Stage 4 recovery and runtime validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage4-foundation-recovery
  cancel-in-progress: false

jobs:
  recover-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: stage4-foundation-recovery
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bootstrap Stage 4 foundation from verified archive
        run: bash .stage4-recovery/bootstrap-stage4-recovery.sh

      - name: Commit imported foundation
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import Stage 4 foundation"
            git push origin HEAD:stage4-foundation-recovery
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies and create real lock file
        run: npm install --no-audit --no-fund

      - name: Commit generated package lock
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore dependency installation"
            git push origin HEAD:stage4-foundation-recovery
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Stage 4 checks
        id: checks
        shell: bash
        run: |
          set +e
          mkdir -p docs/logs
          failures=0
          run_check() {
            name="$1"; shift
            echo "[stage4] $name: $*"
            "$@" >"docs/logs/${name}.log" 2>&1
            code=$?
            echo "$code" >"docs/logs/${name}.exit"
            cat "docs/logs/${name}.log"
            if [ "$code" -ne 0 ]; then failures=1; fi
          }
          run_check tokens-build npm run tokens:build
          run_check source-check npm run source:check
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check unit-tests npm run test
          run_check build npm run build
          run_check e2e npm run test:e2e
          run_check visual npm run test:visual
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create official overlays and diffs
        shell: bash
        run: |
          set +e
          npm run visual:overlay -- tests/visual/references/hero.png tests/visual/actual/hero-1630x965.png hero-runtime > docs/logs/overlay-hero.log 2>&1
          echo $? > docs/logs/overlay-hero.exit
          npm run visual:overlay -- tests/visual/references/central-panels.png tests/visual/actual/central-panels-1536x1024.png central-panels-runtime > docs/logs/overlay-central-panels.log 2>&1
          echo $? > docs/logs/overlay-central-panels.exit
          npm run visual:overlay -- tests/visual/references/configurator.png tests/visual/actual/configurator-1672x941.png configurator-runtime > docs/logs/overlay-configurator.log 2>&1
          echo $? > docs/logs/overlay-configurator.exit
          exit 0

      - name: Write machine-readable runtime summary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          logs = Path('docs/logs')
          results = {}
          for exit_file in sorted(logs.glob('*.exit')):
              try: code = int(exit_file.read_text().strip())
              except Exception: code = None
              results[exit_file.stem] = code
          screenshots = sorted(str(p) for p in Path('tests/visual/actual').glob('*.png'))
          overlays = sorted(str(p) for p in Path('tests/visual/overlays').glob('*.png'))
          diffs = sorted(str(p) for p in Path('tests/visual/diffs').glob('*.png'))
          payload = {'results': results, 'screenshots': screenshots, 'overlays': overlays, 'diffs': diffs}
          Path('docs/BND_STAGE_4_RUNTIME_RESULTS.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          lines = ['# Stage 4 runtime results', '', '| Check | Exit code |', '|---|---:|']
          lines += [f'| `{name}` | {code} |' for name, code in results.items()]
          lines += ['', '## Runtime screenshots'] + [f'- `{p}`' for p in screenshots]
          lines += ['', '## Overlays'] + [f'- `{p}`' for p in overlays]
          lines += ['', '## Diffs'] + [f'- `{p}`' for p in diffs]
          Path('docs/BND_STAGE_4_RUNTIME_RESULTS.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit validation evidence
        run: |
          git add docs/logs docs/BND_STAGE_4_RUNTIME_RESULTS.* package.json playwright.config.ts src tests/visual/actual tests/visual/overlays tests/visual/diffs
          if ! git diff --cached --quiet; then
            git commit -m "test: add runtime validation evidence"
            git push origin HEAD:stage4-foundation-recovery
          fi

      - name: Upload Stage 4 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage4-runtime-evidence
          path: |
            package-lock.json
            docs/logs
            docs/BND_STAGE_4_RUNTIME_RESULTS.*
            tests/visual/actual
            tests/visual/overlays
            tests/visual/diffs
          if-no-files-found: warn

      - name: Enforce Stage 4 gate
        if: steps.checks.outputs.failures != '0'
        run: |
          echo "One or more Stage 4 commands failed. Inspect committed logs and artifact."
          exit 1
