name: Diagnostics Lab quality

on:
  push:
    branches:
      - diagnostics-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-lab:
    name: Build and capture Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bnd-diagnostics-lab.log 2>&1 &
          npx -y wait-on@8.0.4 http://127.0.0.1:3000/diagnostics-lab

      - name: Verify interaction and WebGL state change
        run: node scripts/diagnostics-lab-qa.mjs

      - name: Upload Diagnostics Lab QA
        uses: actions/upload-artifact@v4
        with:
          name: bnd-diagnostics-lab-qa
          path: diagnostics-lab-qa/*.png
          if-no-files-found: error
