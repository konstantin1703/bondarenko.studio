name: Production quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build and full-system QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build does not rewrite TypeScript config
        run: git diff --exit-code -- tsconfig.json

      - name: Verify legacy CSS is not shipped
        run: |
          if grep -R -q --include='*.css' -E 'v12-|v13-' .next/static; then
            echo "Legacy V12/V13 selectors are present in the production CSS bundle."
            grep -R -n --include='*.css' -E 'v12-|v13-' .next/static | head -20
            exit 1
          fi

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bnd-production-quality.log 2>&1 &
          npx -y wait-on@8.0.4 http://127.0.0.1:3000/

      - name: Production smoke checks
        run: |
          set -euo pipefail

          curl -fsS http://127.0.0.1:3000/ -o /tmp/home.html
          grep -q "Цифровые системы" /tmp/home.html
          grep -q 'type="application/ld+json"' /tmp/home.html
          grep -q '"@type":"Organization"' /tmp/home.html
          grep -q '"@type":"WebSite"' /tmp/home.html
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q "sitemap.xml"
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q "bndstudio.art"
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q '"BND Studio"'
          curl -fsS -o /dev/null http://127.0.0.1:3000/opengraph-image
          curl -fsS -o /dev/null http://127.0.0.1:3000/icon.svg

          not_found_status="$(curl -sS -o /tmp/not-found.html -w '%{http_code}' http://127.0.0.1:3000/route-that-does-not-exist)"
          test "$not_found_status" = "404"
          grep -q "Такого маршрута нет" /tmp/not-found.html

          for lab_route in hero-lab diagnostics-lab capabilities-lab brief-lab footer-lab system-lab; do
            lab_status="$(curl -sS -o /tmp/lab-route.html -w '%{http_code}' "http://127.0.0.1:3000/${lab_route}")"
            test "$lab_status" = "404"
            grep -q "Такого маршрута нет" /tmp/lab-route.html
          done

          headers="$(curl -fsSI http://127.0.0.1:3000/)"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'

          honeypot_status="$(curl -sS -D /tmp/lead-headers.txt -o /tmp/honeypot.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"website":"filled-by-bot"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$honeypot_status" = "200"
          grep -q '"ok":true' /tmp/honeypot.json
          grep -qi '^cache-control:.*no-store' /tmp/lead-headers.txt
          grep -qi '^x-robots-tag:.*noindex' /tmp/lead-headers.txt
          grep -qi '^referrer-policy: no-referrer' /tmp/lead-headers.txt

          invalid_status="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"name":"Test"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$invalid_status" = "400"

          malformed_status="$(curl -sS -o /tmp/malformed.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data-binary '{' \
            http://127.0.0.1:3000/api/lead)"
          test "$malformed_status" = "400"

          node -e 'process.stdout.write(JSON.stringify({ website: "x".repeat(24100) }))' > /tmp/oversized.json
          oversized_status="$(curl -sS -o /tmp/oversized-response.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/oversized.json \
            http://127.0.0.1:3000/api/lead)"
          test "$oversized_status" = "413"

          cross_site_status="$(curl -sS -o /tmp/cross-site.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'origin: https://example.invalid' \
            -H 'sec-fetch-site: cross-site' \
            -d '{"website":"would-otherwise-pass-honeypot"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$cross_site_status" = "403"

          media_status="$(curl -sS -o /tmp/media.json -w '%{http_code}' \
            -H 'content-type: text/plain; application/json' \
            -d 'plain text' \
            http://127.0.0.1:3000/api/lead)"
          test "$media_status" = "415"

      - name: Verify initial material lifecycle budget
        run: node scripts/material-lifecycle-qa.mjs

      - name: Full-system Chromium and WebKit QA
        run: npm run test:e2e

      - name: Capture section-level visual audit
        run: |
          mkdir -p visual-audit
          for section in hero diagnostics capabilities brief footer; do
            npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 "http://127.0.0.1:3000/#${section}" "visual-audit/${section}-desktop.png"
            npx playwright screenshot --browser webkit --viewport-size="430,932" --wait-for-timeout=1400 "http://127.0.0.1:3000/#${section}" "visual-audit/${section}-mobile-430.png"
          done
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=800 "http://127.0.0.1:3000/route-that-does-not-exist" "visual-audit/not-found-desktop.png"
          npx playwright screenshot --browser webkit --viewport-size="430,932" --wait-for-timeout=800 "http://127.0.0.1:3000/route-that-does-not-exist" "visual-audit/not-found-mobile-430.png"
          curl -fsS http://127.0.0.1:3000/opengraph-image -o visual-audit/opengraph-image.png
          test -s visual-audit/opengraph-image.png

      - name: Upload full-system QA
        uses: actions/upload-artifact@v4
        with:
          name: bnd-production-quality-qa
          path: |
            system-integration-qa/*.png
            visual-audit/*.png
          if-no-files-found: error
