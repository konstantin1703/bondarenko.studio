name: Stage 9 Remaining Sections validation

on:
  push:
    branches:
      - stage9-remaining-sections
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: stage9-remaining-sections-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-stage9:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEAD_SHA: ${{ github.sha }}
      HEAD_REF: stage9-remaining-sections
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org

    steps:
      - name: Checkout Stage 9 HEAD
        uses: actions/checkout@v4
        with:
          ref: stage9-remaining-sections
          fetch-depth: 0

      - name: Confirm checked-out HEAD
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run complete Stage 9 validation
        shell: bash
        run: |
          set +e
          mkdir -p stage9-validation/logs
          : > stage9-validation/results.tsv
          failures=0

          run_check() {
            name="$1"
            shift
            echo "[stage9] ${name}: $*"
            "$@" >"stage9-validation/logs/${name}.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> stage9-validation/results.tsv
            cat "stage9-validation/logs/${name}.log"
            if [ "$code" -ne 0 ]; then failures=1; fi
          }

          run_check tokens-build npm run tokens:build
          run_check source-check npm run source:check
          run_check stage9-source-check node scripts/stage9-source-check.mjs
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check unit-tests npm run test
          run_check build npm run build
          run_check e2e npm run test:e2e
          run_check visual npm run test:visual
          run_check contact-sheets node scripts/create-stage9-contact-sheets.mjs
          run_check hero-regression-overlay npm run visual:overlay -- \
            tests/visual/actual/stage5-1-hero-1630x965.png \
            tests/visual/actual/stage9-hero-regression-1630x965.png \
            stage9-hero-regression
          run_check central-panels-regression-overlay npm run visual:overlay -- \
            tests/visual/actual/stage8-central-panels-default-1536x1024.png \
            tests/visual/actual/stage9-central-panels-regression-1536x1024.png \
            stage9-central-panels-regression
          run_check configurator-regression-overlay npm run visual:overlay -- \
            tests/visual/actual/stage7-configurator-1672x941.png \
            tests/visual/actual/stage9-configurator-regression-1672x941.png \
            stage9-configurator-regression
          run_check evidence-files test \
            -s tests/visual/actual/stage9-projects-1536x700.png \
            -a -s tests/visual/actual/stage9-workflow-1536x700.png \
            -a -s tests/visual/actual/stage9-technologies-1536x700.png \
            -a -s tests/visual/actual/stage9-contact-footer-1536x900.png \
            -a -s tests/visual/actual/stage9-lower-page-1536x3000.png \
            -a -s tests/visual/actual/stage9-lower-page-tablet-768x3000.png \
            -a -s tests/visual/actual/stage9-lower-page-mobile-390x3600.png \
            -a -s tests/visual/actual/stage9-full-page-1440.png \
            -a -s tests/visual/actual/stage9-full-page-390.png \
            -a -s tests/visual/contact-sheets/stage9-full-page-desktop-contact-sheet.png \
            -a -s tests/visual/contact-sheets/stage9-full-page-mobile-contact-sheet.png \
            -a -s tests/visual/actual/stage9-hero-regression-1630x965.png \
            -a -s tests/visual/actual/stage9-central-panels-regression-1536x1024.png \
            -a -s tests/visual/actual/stage9-configurator-regression-1672x941.png \
            -a -s tests/visual/overlays/stage9-hero-regression-overlay.png \
            -a -s tests/visual/diffs/stage9-hero-regression-diff.png \
            -a -s tests/visual/overlays/stage9-central-panels-regression-overlay.png \
            -a -s tests/visual/diffs/stage9-central-panels-regression-diff.png \
            -a -s tests/visual/overlays/stage9-configurator-regression-overlay.png \
            -a -s tests/visual/diffs/stage9-configurator-regression-diff.png
          run_check security-env-local bash -c '! find . -path "./node_modules" -prune -o -name ".env.local" -print -quit | grep -q .'
          run_check security-secrets bash -c '! grep -RIE --exclude-dir=node_modules --exclude-dir=.git --exclude="package-lock.json" "(sk-[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|SUPABASE_(SERVICE_ROLE|ANON)_KEY=.\+|WEBHOOK_SECRET=.\+|SMTP_PASSWORD=.\+)" src .env.example'
          run_check security-lower-page bash -c '! grep -RIE "fetch[[:space:]]*\(|XMLHttpRequest|WebSocket|axios|localStorage|sessionStorage|URLSearchParams|use server|gtag|GoogleAnalytics|segment|mixpanel|amplitude|posthog" src/components/projects src/components/sections src/data/stage9-remaining-sections.ts'
          run_check security-external-form bash -c '! grep -RIE "<form[^>]+action=|formAction=|mailto:|https://.*form" src/components/sections/ContactFoundation'

          python3 - <<'PY'
          from pathlib import Path
          import json, os
          rows=[]
          for line in Path('stage9-validation/results.tsv').read_text().splitlines():
              name, code=line.split('\t')
              rows.append({'check':name,'exit_code':int(code)})
          payload={
              'validated_commit': os.environ['HEAD_SHA'],
              'branch': os.environ['HEAD_REF'],
              'results': rows,
          }
          Path('stage9-validation/results.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

          exit "$failures"

      - name: Commit official Stage 9 runtime evidence once
        shell: bash
        run: |
          if test -f tests/visual/.stage9-evidence-locked; then
            echo "Stage 9 evidence is already locked; validation will not move branch HEAD."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch tests/visual/.stage9-evidence-locked
          git add -- \
            tests/visual/.stage9-evidence-locked \
            tests/visual/actual/stage9-*.png \
            tests/visual/contact-sheets/stage9-*.png \
            tests/visual/overlays/stage9-*.png \
            tests/visual/diffs/stage9-*.png
          git commit -m "test: add Stage 9 full-page visual evidence [skip ci]"
          git push origin HEAD:stage9-remaining-sections

      - name: Upload Stage 9 validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-remaining-sections-${{ env.HEAD_SHA }}
          path: |
            stage9-validation/
            test-results/
            playwright-report/
            tests/visual/actual/stage9-*.png
            tests/visual/contact-sheets/stage9-*.png
            tests/visual/overlays/stage9-*.png
            tests/visual/diffs/stage9-*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Stage 9 commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Stage 9 Remaining Sections validation passed"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            state=error
            description="Stage 9 Remaining Sections validation cancelled"
          else
            state=failure
            description="Stage 9 Remaining Sections validation failed"
          fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"state": sys.argv[1], "target_url": sys.argv[2], "description": sys.argv[3], "context": "stage9/remaining-sections-validation"}))' "$state" "$target_url" "$description")"
