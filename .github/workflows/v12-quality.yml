name: V12 quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, build and visual QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bnd-v12-next.log 2>&1 &
          npx -y wait-on@8.0.4 http://127.0.0.1:3000

      - name: Production smoke checks
        run: |
          set -euo pipefail

          curl -fsS http://127.0.0.1:3000/ | grep -q "Цифровые системы"
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q "sitemap.xml"
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q "bndstudio.art"
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q '"BND Studio"'
          curl -fsS -o /dev/null http://127.0.0.1:3000/opengraph-image
          curl -fsS -o /dev/null http://127.0.0.1:3000/icon.svg
          curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/route-that-does-not-exist | grep -q '404'

          headers="$(curl -fsSI http://127.0.0.1:3000/)"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'

          honeypot_status="$(curl -sS -o /tmp/honeypot.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"website":"filled-by-bot"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$honeypot_status" = "200"
          grep -q '"ok":true' /tmp/honeypot.json

          invalid_status="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"name":"Test"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$invalid_status" = "400"

          media_status="$(curl -sS -o /tmp/media.json -w '%{http_code}' \
            -d 'plain text' \
            http://127.0.0.1:3000/api/lead)"
          test "$media_status" = "415"

      - name: End-to-end interaction checks
        run: npx -y @playwright/test@1.55.0 test tests/v12.spec.ts --reporter=line --workers=1

      - name: Capture section-level desktop and mobile QA
        run: |
          mkdir -p qa
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 http://127.0.0.1:3000/#hero qa/01-hero-desktop.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 http://127.0.0.1:3000/#diagnostics qa/02-diagnostics-desktop.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 http://127.0.0.1:3000/#capabilities qa/03-capabilities-desktop.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 http://127.0.0.1:3000/#brief qa/04-brief-desktop.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1400 http://127.0.0.1:3000/#hero qa/01-hero-mobile.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1400 http://127.0.0.1:3000/#diagnostics qa/02-diagnostics-mobile.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1400 http://127.0.0.1:3000/#capabilities qa/03-capabilities-mobile.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1400 http://127.0.0.1:3000/#brief qa/04-brief-mobile.png

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: bnd-v12-visual-qa
          path: qa/*.png
          if-no-files-found: error
