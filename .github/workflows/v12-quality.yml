name: V12 quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Typecheck, build and visual QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Persist generated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "V12: lock dependency graph"
          git push origin HEAD:${{ github.head_ref }}

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build does not rewrite TypeScript config
        run: git diff --exit-code -- tsconfig.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bnd-v12-next.log 2>&1 &
          npx -y wait-on@8.0.4 http://127.0.0.1:3000

      - name: Production smoke checks
        run: |
          set -euo pipefail

          curl -fsS http://127.0.0.1:3000/ | grep -q "Цифровые системы"
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q "sitemap.xml"
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q "bndstudio.art"
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q '"BND Studio"'
          curl -fsS -o /dev/null http://127.0.0.1:3000/opengraph-image
          curl -fsS -o /dev/null http://127.0.0.1:3000/icon.svg

          not_found_status="$(curl -sS -o /tmp/not-found.html -w '%{http_code}' http://127.0.0.1:3000/route-that-does-not-exist)"
          test "$not_found_status" = "404"
          grep -q "Такого маршрута нет" /tmp/not-found.html

          headers="$(curl -fsSI http://127.0.0.1:3000/)"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'

          honeypot_status="$(curl -sS -o /tmp/honeypot.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"website":"filled-by-bot"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$honeypot_status" = "200"
          grep -q '"ok":true' /tmp/honeypot.json

          invalid_status="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"name":"Test"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$invalid_status" = "400"

          media_status="$(curl -sS -o /tmp/media.json -w '%{http_code}' \
            -d 'plain text' \
            http://127.0.0.1:3000/api/lead)"
          test "$media_status" = "415"

      - name: End-to-end interaction checks
        run: npm run test:e2e

      - name: Capture section-level desktop and mobile QA
        run: |
          mkdir -p qa
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 http://127.0.0.1:3000/#hero qa/01-hero-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 http://127.0.0.1:3000/#diagnostics qa/02-diagnostics-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 http://127.0.0.1:3000/#capabilities qa/03-capabilities-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1400 http://127.0.0.1:3000/#brief qa/04-brief-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1400 http://127.0.0.1:3000/#hero qa/01-hero-mobile.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1400 http://127.0.0.1:3000/#diagnostics qa/02-diagnostics-mobile.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1400 http://127.0.0.1:3000/#capabilities qa/03-capabilities-mobile.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1400 http://127.0.0.1:3000/#brief qa/04-brief-mobile.png

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: bnd-v12-visual-qa
          path: qa/*.png
          if-no-files-found: error
