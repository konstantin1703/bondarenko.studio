name: Production quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, build and visual QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build does not rewrite TypeScript config
        run: git diff --exit-code -- tsconfig.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bnd-v13-next.log 2>&1 &
          npx -y wait-on@8.0.4 http://127.0.0.1:3000

      - name: Production smoke checks
        run: |
          set -euo pipefail

          curl -fsS http://127.0.0.1:3000/ | grep -q "Цифровые системы"
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q "sitemap.xml"
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q "bndstudio.art"
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q '"BND Studio"'
          curl -fsS -o /dev/null http://127.0.0.1:3000/opengraph-image
          curl -fsS -o /dev/null http://127.0.0.1:3000/icon.svg

          not_found_status="$(curl -sS -o /tmp/not-found.html -w '%{http_code}' http://127.0.0.1:3000/route-that-does-not-exist)"
          test "$not_found_status" = "404"
          grep -q "Такого маршрута нет" /tmp/not-found.html

          headers="$(curl -fsSI http://127.0.0.1:3000/)"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'

          honeypot_status="$(curl -sS -o /tmp/honeypot.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"website":"filled-by-bot"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$honeypot_status" = "200"
          grep -q '"ok":true' /tmp/honeypot.json

          invalid_status="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"name":"Test"}' \
            http://127.0.0.1:3000/api/lead)"
          test "$invalid_status" = "400"

          media_status="$(curl -sS -o /tmp/media.json -w '%{http_code}' \
            -d 'plain text' \
            http://127.0.0.1:3000/api/lead)"
          test "$media_status" = "415"

      - name: Chromium end-to-end interaction checks
        run: npm run test:e2e

      - name: WebKit mobile regression checks
        run: npx playwright test tests/production.spec.ts --reporter=line --workers=1 --browser=webkit

      - name: Integrated WebGL and reduced-motion checks
        run: node scripts/system-integration-qa.mjs

      - name: Capture section-level visual QA
        run: |
          mkdir -p qa
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1800 http://127.0.0.1:3000/#hero qa/01-hero-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1800 http://127.0.0.1:3000/#diagnostics qa/02-diagnostics-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1800 http://127.0.0.1:3000/#capabilities qa/03-capabilities-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1800 http://127.0.0.1:3000/#brief qa/04-brief-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1800 http://127.0.0.1:3000/#hero qa/01-hero-mobile.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1800 http://127.0.0.1:3000/#diagnostics qa/02-diagnostics-mobile.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1800 http://127.0.0.1:3000/#capabilities qa/03-capabilities-mobile.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1800 http://127.0.0.1:3000/#brief qa/04-brief-mobile.png
          npx playwright screenshot --browser chromium --viewport-size="428,926" --wait-for-timeout=1800 http://127.0.0.1:3000/#hero qa/05-hero-iphone-pro-max.png
          npx playwright screenshot --browser chromium --viewport-size="428,926" --wait-for-timeout=1800 http://127.0.0.1:3000/#diagnostics qa/06-diagnostics-iphone-pro-max.png
          npx playwright screenshot --browser chromium --viewport-size="428,926" --wait-for-timeout=1800 http://127.0.0.1:3000/#capabilities qa/07-capabilities-iphone-pro-max.png
          npx playwright screenshot --browser chromium --viewport-size="428,926" --wait-for-timeout=1800 http://127.0.0.1:3000/#brief qa/08-brief-iphone-pro-max.png
          npx playwright screenshot --browser chromium --viewport-size="1440,1000" --wait-for-timeout=1800 http://127.0.0.1:3000/#footer qa/09-footer-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="428,926" --wait-for-timeout=1800 http://127.0.0.1:3000/#footer qa/10-footer-iphone-pro-max.png
          npx playwright screenshot --browser webkit --viewport-size="428,926" --wait-for-timeout=1800 http://127.0.0.1:3000/#hero qa/11-hero-webkit-iphone.png
          npx playwright screenshot --browser webkit --viewport-size="428,926" --wait-for-timeout=1800 http://127.0.0.1:3000/#brief qa/12-brief-webkit-iphone.png

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: bnd-v13-visual-qa
          path: qa/*.png
          if-no-files-found: error
