name: Stage 6 central panels validation

on:
  push:
    branches:
      - stage6-central-panels-calibration
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: stage6-central-panels-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-stage6:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.sha }}
      HEAD_REF: stage6-central-panels-calibration

    steps:
      - name: Checkout exact Stage 6 HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm checked-out HEAD
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run complete Stage 6 validation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p stage6-validation/logs
          : > stage6-validation/results.tsv
          failures=0

          run_check() {
            name="$1"
            shift
            "$@" >"stage6-validation/logs/${name}.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> stage6-validation/results.tsv
            cat "stage6-validation/logs/${name}.log"
            if [ "$code" -ne 0 ]; then failures=1; fi
          }

          run_check tokens-build npm run tokens:build
          run_check source-check npm run source:check
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check unit-tests npm run test
          run_check build npm run build
          run_check e2e npm run test:e2e
          run_check visual npm run test:visual
          run_check central-overlay npm run visual:overlay -- \
            tests/visual/references/central-panels.png \
            tests/visual/actual/stage6-central-panels-1536x1024.png \
            stage6-central-panels-runtime
          run_check hero-regression-overlay npm run visual:overlay -- \
            tests/visual/actual/stage5-1-hero-1630x965.png \
            tests/visual/actual/stage6-hero-regression-1630x965.png \
            stage6-hero-regression
          run_check evidence-files test \
            -s tests/visual/actual/stage6-central-panels-1536x1024.png \
            -a -s tests/visual/actual/stage6-problem-explorer-1536x620.png \
            -a -s tests/visual/actual/stage6-product-assembler-1536x620.png \
            -a -s tests/visual/actual/stage6-central-panels-tablet-768x1400.png \
            -a -s tests/visual/actual/stage6-central-panels-mobile-390x1600.png \
            -a -s tests/visual/actual/stage6-hero-regression-1630x965.png \
            -a -s tests/visual/overlays/stage6-central-panels-runtime-overlay.png \
            -a -s tests/visual/diffs/stage6-central-panels-runtime-diff.png

          python3 - <<'PY'
          from pathlib import Path
          import json, os
          rows=[]
          for line in Path('stage6-validation/results.tsv').read_text().splitlines():
              name, code=line.split('\t')
              rows.append({'check':name,'exit_code':int(code)})
          Path('stage6-validation/results.json').write_text(json.dumps({
              'validated_commit': os.environ['HEAD_SHA'],
              'branch': os.environ['HEAD_REF'],
              'run_id': '${{ github.run_id }}',
              'results': rows,
          }, indent=2), encoding='utf-8')
          PY

          exit "$failures"

      - name: Upload Stage 6 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-central-panels-${{ env.HEAD_SHA }}
          path: |
            stage6-validation/
            tests/visual/actual/stage6-central-panels-1536x1024.png
            tests/visual/actual/stage6-problem-explorer-1536x620.png
            tests/visual/actual/stage6-product-assembler-1536x620.png
            tests/visual/actual/stage6-central-panels-tablet-768x1400.png
            tests/visual/actual/stage6-central-panels-mobile-390x1600.png
            tests/visual/actual/stage6-hero-regression-1630x965.png
            tests/visual/overlays/stage6-central-panels-runtime-overlay.png
            tests/visual/diffs/stage6-central-panels-runtime-diff.png
            tests/visual/overlays/stage6-hero-regression-overlay.png
            tests/visual/diffs/stage6-hero-regression-diff.png
          retention-days: 14
          if-no-files-found: error

      - name: Publish Stage 6 commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=failure
          description="Stage 6 validation failed"
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            state=success
            description="Stage 6 validation passed"
          fi
          gh api --method POST repos/${{ github.repository }}/statuses/$HEAD_SHA \
            -f state="$state" \
            -f context="Stage 6 full validation" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail when Stage 6 gate fails
        if: steps.validation.outcome != 'success'
        run: exit 1
