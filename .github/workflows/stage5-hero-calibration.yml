name: Stage 5 Hero calibration

on:
  push:
    branches:
      - stage5-hero-calibration
  pull_request:
    branches:
      - stage4-foundation-recovery
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage5-hero-calibration-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate-hero:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout branch HEAD
        uses: actions/checkout@v4
        with:
          ref: stage5-hero-calibration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run complete Stage 5 validation
        shell: bash
        run: |
          set +e
          mkdir -p stage5-validation/logs
          : > stage5-validation/results.tsv
          failures=0

          run_check() {
            name="$1"
            shift
            echo "[stage5] ${name}: $*"
            "$@" >"stage5-validation/logs/${name}.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> stage5-validation/results.tsv
            cat "stage5-validation/logs/${name}.log"
            if [ "$code" -ne 0 ]; then failures=1; fi
          }

          run_check tokens-build npm run tokens:build
          run_check source-check npm run source:check
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check unit-tests npm run test
          run_check build npm run build
          run_check e2e npm run test:e2e
          run_check visual npm run test:visual
          run_check overlay npm run visual:overlay -- \
            tests/visual/references/hero.png \
            tests/visual/actual/stage5-hero-1630x965.png \
            stage5-hero-runtime

          run_check evidence-files test \
            -s tests/visual/actual/stage5-hero-1630x965.png \
            -a -s tests/visual/actual/stage5-hero-1440x900.png \
            -a -s tests/visual/actual/stage5-hero-mobile-390x844.png \
            -a -s tests/visual/actual/stage5-hero-tablet-768x1024.png \
            -a -s tests/visual/overlays/stage5-hero-runtime-overlay.png \
            -a -s tests/visual/diffs/stage5-hero-runtime-diff.png

          python3 - <<'PY'
          from pathlib import Path
          import json, os
          rows=[]
          for line in Path('stage5-validation/results.tsv').read_text().splitlines():
              name, code=line.split('\t')
              rows.append({'check':name,'exit_code':int(code)})
          payload={
              'validated_commit': os.environ['GITHUB_SHA'],
              'results': rows,
              'evidence': [
                  'tests/visual/actual/stage5-hero-1630x965.png',
                  'tests/visual/actual/stage5-hero-1440x900.png',
                  'tests/visual/actual/stage5-hero-mobile-390x844.png',
                  'tests/visual/actual/stage5-hero-tablet-768x1024.png',
                  'tests/visual/overlays/stage5-hero-runtime-overlay.png',
                  'tests/visual/diffs/stage5-hero-runtime-diff.png',
              ],
          }
          Path('stage5-validation/results.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

          exit "$failures"

      - name: Commit official Stage 5 runtime evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tests/visual/actual/stage5-hero-1630x965.png \
            tests/visual/actual/stage5-hero-1440x900.png \
            tests/visual/actual/stage5-hero-mobile-390x844.png \
            tests/visual/actual/stage5-hero-tablet-768x1024.png \
            tests/visual/overlays/stage5-hero-runtime-overlay.png \
            tests/visual/diffs/stage5-hero-runtime-diff.png
          if ! git diff --cached --quiet; then
            git commit -m "test: add Stage 5 runtime visual evidence"
            git push origin HEAD:stage5-hero-calibration
          fi

      - name: Upload Stage 5 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5-hero-${{ github.sha }}
          path: |
            stage5-validation/
            tests/visual/actual/stage5-hero-1630x965.png
            tests/visual/actual/stage5-hero-1440x900.png
            tests/visual/actual/stage5-hero-mobile-390x844.png
            tests/visual/actual/stage5-hero-tablet-768x1024.png
            tests/visual/overlays/stage5-hero-runtime-overlay.png
            tests/visual/diffs/stage5-hero-runtime-diff.png
          retention-days: 14
          if-no-files-found: error
