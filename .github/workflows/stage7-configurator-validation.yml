name: Stage 7 Configurator validation

on:
  push:
    branches:
      - stage7-configurator-calibration
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: stage7-configurator-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-stage7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.sha }}
      HEAD_REF: stage7-configurator-calibration
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org

    steps:
      - name: Checkout Stage 7 HEAD
        uses: actions/checkout@v4
        with:
          ref: stage7-configurator-calibration
          fetch-depth: 0

      - name: Confirm checked-out HEAD
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run complete Stage 7 validation
        shell: bash
        run: |
          set +e
          mkdir -p stage7-validation/logs
          : > stage7-validation/results.tsv
          failures=0

          run_check() {
            name="$1"
            shift
            echo "[stage7] ${name}: $*"
            "$@" >"stage7-validation/logs/${name}.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> stage7-validation/results.tsv
            cat "stage7-validation/logs/${name}.log"
            if [ "$code" -ne 0 ]; then failures=1; fi
          }

          run_check tokens-build npm run tokens:build
          run_check source-check npm run source:check
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check unit-tests npm run test
          run_check build npm run build
          run_check e2e npm run test:e2e
          run_check visual npm run test:visual
          run_check configurator-overlay npm run visual:overlay -- \
            tests/visual/references/configurator.png \
            tests/visual/actual/stage7-configurator-1672x941.png \
            stage7-configurator-runtime
          run_check hero-regression-overlay npm run visual:overlay -- \
            tests/visual/actual/stage5-1-hero-1630x965.png \
            tests/visual/actual/stage7-hero-regression-1630x965.png \
            stage7-hero-regression
          run_check central-panels-regression-overlay npm run visual:overlay -- \
            tests/visual/actual/stage6-central-panels-1536x1024.png \
            tests/visual/actual/stage7-central-panels-regression-1536x1024.png \
            stage7-central-panels-regression
          run_check evidence-files test \
            -s tests/visual/actual/stage7-configurator-1672x941.png \
            -a -s tests/visual/actual/stage7-configurator-1440x1000.png \
            -a -s tests/visual/actual/stage7-configurator-tablet-768x1400.png \
            -a -s tests/visual/actual/stage7-configurator-mobile-390x1800.png \
            -a -s tests/visual/actual/stage7-configurator-left-1672x941.png \
            -a -s tests/visual/actual/stage7-configurator-center-1672x941.png \
            -a -s tests/visual/actual/stage7-configurator-preview-1672x941.png \
            -a -s tests/visual/actual/stage7-hero-regression-1630x965.png \
            -a -s tests/visual/actual/stage7-central-panels-regression-1536x1024.png \
            -a -s tests/visual/overlays/stage7-configurator-runtime-overlay.png \
            -a -s tests/visual/diffs/stage7-configurator-runtime-diff.png \
            -a -s tests/visual/overlays/stage7-hero-regression-overlay.png \
            -a -s tests/visual/diffs/stage7-hero-regression-diff.png \
            -a -s tests/visual/overlays/stage7-central-panels-regression-overlay.png \
            -a -s tests/visual/diffs/stage7-central-panels-regression-diff.png
          run_check security-env-local bash -c '! find . -path "./node_modules" -prune -o -name ".env.local" -print -quit | grep -q .'
          run_check security-secrets bash -c '! grep -RIE --exclude-dir=node_modules --exclude-dir=.git --exclude="package-lock.json" "(sk-[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|SUPABASE_SERVICE_ROLE_KEY=.\+|WEBHOOK_SECRET=.\+)" src .env.example'

          python3 - <<'PY'
          from pathlib import Path
          import json, os
          rows=[]
          for line in Path('stage7-validation/results.tsv').read_text().splitlines():
              name, code=line.split('\t')
              rows.append({'check':name,'exit_code':int(code)})
          payload={
              'validated_commit': os.environ['HEAD_SHA'],
              'branch': os.environ['HEAD_REF'],
              'results': rows,
              'evidence': [
                  'tests/visual/actual/stage7-configurator-1672x941.png',
                  'tests/visual/actual/stage7-configurator-1440x1000.png',
                  'tests/visual/actual/stage7-configurator-tablet-768x1400.png',
                  'tests/visual/actual/stage7-configurator-mobile-390x1800.png',
                  'tests/visual/actual/stage7-configurator-left-1672x941.png',
                  'tests/visual/actual/stage7-configurator-center-1672x941.png',
                  'tests/visual/actual/stage7-configurator-preview-1672x941.png',
                  'tests/visual/actual/stage7-hero-regression-1630x965.png',
                  'tests/visual/actual/stage7-central-panels-regression-1536x1024.png',
                  'tests/visual/overlays/stage7-configurator-runtime-overlay.png',
                  'tests/visual/diffs/stage7-configurator-runtime-diff.png',
                  'tests/visual/overlays/stage7-hero-regression-overlay.png',
                  'tests/visual/diffs/stage7-hero-regression-diff.png',
                  'tests/visual/overlays/stage7-central-panels-regression-overlay.png',
                  'tests/visual/diffs/stage7-central-panels-regression-diff.png',
              ],
          }
          Path('stage7-validation/results.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

          exit "$failures"

      - name: Commit official Stage 7 runtime evidence once
        shell: bash
        run: |
          if test -f tests/visual/.stage7-evidence-locked; then
            echo "Stage 7 evidence is already locked; validation will not move branch HEAD."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch tests/visual/.stage7-evidence-locked
          git add -- \
            tests/visual/.stage7-evidence-locked \
            tests/visual/actual/stage7-configurator-1672x941.png \
            tests/visual/actual/stage7-configurator-1440x1000.png \
            tests/visual/actual/stage7-configurator-tablet-768x1400.png \
            tests/visual/actual/stage7-configurator-mobile-390x1800.png \
            tests/visual/actual/stage7-configurator-left-1672x941.png \
            tests/visual/actual/stage7-configurator-center-1672x941.png \
            tests/visual/actual/stage7-configurator-preview-1672x941.png \
            tests/visual/actual/stage7-hero-regression-1630x965.png \
            tests/visual/actual/stage7-central-panels-regression-1536x1024.png \
            tests/visual/overlays/stage7-configurator-runtime-overlay.png \
            tests/visual/diffs/stage7-configurator-runtime-diff.png \
            tests/visual/overlays/stage7-hero-regression-overlay.png \
            tests/visual/diffs/stage7-hero-regression-diff.png \
            tests/visual/overlays/stage7-central-panels-regression-overlay.png \
            tests/visual/diffs/stage7-central-panels-regression-diff.png
          git commit -m "test: add Stage 7 runtime visual evidence [skip ci]"
          git push origin HEAD:stage7-configurator-calibration

      - name: Upload Stage 7 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage7-configurator-${{ env.HEAD_SHA }}
          path: |
            stage7-validation/
            tests/visual/actual/stage7-configurator-1672x941.png
            tests/visual/actual/stage7-configurator-1440x1000.png
            tests/visual/actual/stage7-configurator-tablet-768x1400.png
            tests/visual/actual/stage7-configurator-mobile-390x1800.png
            tests/visual/actual/stage7-configurator-left-1672x941.png
            tests/visual/actual/stage7-configurator-center-1672x941.png
            tests/visual/actual/stage7-configurator-preview-1672x941.png
            tests/visual/actual/stage7-hero-regression-1630x965.png
            tests/visual/actual/stage7-central-panels-regression-1536x1024.png
            tests/visual/overlays/stage7-configurator-runtime-overlay.png
            tests/visual/diffs/stage7-configurator-runtime-diff.png
            tests/visual/overlays/stage7-hero-regression-overlay.png
            tests/visual/diffs/stage7-hero-regression-diff.png
            tests/visual/overlays/stage7-central-panels-regression-overlay.png
            tests/visual/diffs/stage7-central-panels-regression-diff.png
          retention-days: 14
          if-no-files-found: error

      - name: Publish Stage 7 commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Stage 7 Configurator validation passed"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            state=error
            description="Stage 7 Configurator validation cancelled"
          else
            state=failure
            description="Stage 7 Configurator validation failed"
          fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"state": sys.argv[1], "target_url": sys.argv[2], "description": sys.argv[3], "context": "stage7/configurator-validation"}))' "$state" "$target_url" "$description")"
