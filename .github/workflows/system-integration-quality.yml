name: Production candidate quality

on:
  push:
    branches:
      - production-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-candidate:
    name: Build and verify production root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bnd-production-candidate.log 2>&1 &
          npx -y wait-on@8.0.4 http://127.0.0.1:3000/

      - name: Verify production root on desktop and mobile
        run: |
          sed -i 's#http://127.0.0.1:3000/system-lab#http://127.0.0.1:3000/#g' scripts/system-integration-qa.mjs
          node scripts/system-integration-qa.mjs

      - name: Upload production candidate QA
        uses: actions/upload-artifact@v4
        with:
          name: bnd-production-candidate-qa
          path: system-integration-qa/*.png
          if-no-files-found: error
