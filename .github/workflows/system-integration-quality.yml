name: System integration quality

on:
  push:
    branches:
      - system-integration
      - system-performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-integration:
    name: Build and verify complete system
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/bnd-system-integration.log 2>&1 &
          npx -y wait-on@8.0.4 http://127.0.0.1:3000/system-lab

      - name: Verify complete desktop and mobile route
        run: node scripts/system-integration-qa.mjs

      - name: Upload integration QA
        uses: actions/upload-artifact@v4
        with:
          name: bnd-system-integration-qa
          path: system-integration-qa/*.png
          if-no-files-found: error
